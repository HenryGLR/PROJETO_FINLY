<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finly | Carregando</title>
    <meta name="description" content="Finly, seu painel financeiro inteligente.">
    <link rel="stylesheet" href="./src/css/style.css">

    <style>
        .index-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 80% 0%, rgba(37, 99, 235, 0.14), transparent 34%),
                radial-gradient(circle at 15% 100%, rgba(22, 163, 74, 0.1), transparent 34%),
                var(--color-bg);
        }

        .index-loader {
            width: min(100%, 460px);
            display: grid;
            justify-items: center;
            gap: 22px;
            padding: 42px 32px;
            text-align: center;
            background: var(--color-surface);
            border: 1px solid var(--color-border-soft);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-lg);
        }

        .index-loader__logo {
            display: grid;
            place-items: center;
            width: 78px;
            height: 78px;
            color: #ffffff;
            font-family: var(--font-secondary);
            font-size: 2.1rem;
            font-weight: 900;
            background: var(--gradient-primary);
            border-radius: 24px;
            box-shadow: var(--shadow-primary);
            animation: indexPulse 1.8s ease-in-out infinite;
        }

        .index-loader__content {
            display: grid;
            gap: 8px;
        }

        .index-loader__title {
            font-family: var(--font-secondary);
            font-size: clamp(2.2rem, 8vw, 3.5rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.07em;
            color: var(--color-text);
        }

        .index-loader__text {
            max-width: 340px;
            font-size: 0.94rem;
            font-weight: 650;
            line-height: 1.55;
            color: var(--color-text-muted);
        }

        .index-loader__bar {
            width: min(100%, 280px);
            height: 10px;
            overflow: hidden;
            background: var(--color-surface-soft);
            border-radius: var(--radius-full);
        }

        .index-loader__progress {
            display: block;
            width: 45%;
            height: 100%;
            background: var(--gradient-primary);
            border-radius: inherit;
            animation: indexLoading 1.25s ease-in-out infinite;
        }

        .index-loader__actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        @keyframes indexPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        @keyframes indexLoading {
            0% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(240%);
            }
        }

        @media (max-width: 520px) {
            .index-loader {
                padding: 34px 22px;
            }

            .index-loader__actions,
            .index-loader__actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="index-page">
        <section class="index-loader">
            <span class="index-loader__logo">F</span>

            <div class="index-loader__content">
                <h1 class="index-loader__title">Finly</h1>

                <p class="index-loader__text">
                    Organizando seu dinheiro, suas metas e seus próximos passos financeiros.
                </p>
            </div>

            <div class="index-loader__bar" aria-hidden="true">
                <span class="index-loader__progress"></span>
            </div>

            <div class="index-loader__actions">
                <a class="btn btn-primary" href="./pages/login.html">Entrar</a>
                <a class="btn btn-soft" href="./pages/cadastro.html">Criar conta</a>
            </div>
        </section>
    </main>

    <script>
        (() => {
            const getStorage = (key) => {
                try {
                    return JSON.parse(localStorage.getItem(key));
                } catch {
                    return null;
                }
            };

            const session = getStorage("finly_session");
            const profile = getStorage("finly_user_profile");

            const hasUser = Boolean(
                session?.name ||
                session?.email ||
                profile?.name ||
                profile?.email
            );

            const targetPage = hasUser
                ? "./pages/dashboard.html"
                : "./pages/login.html";

            setTimeout(() => {
                window.location.replace(targetPage);
            }, 1200);
        })();
    </script>
</body>
</html>
